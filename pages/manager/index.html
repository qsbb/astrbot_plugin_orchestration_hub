<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>凝心溯溪-枢</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header><div><small>凝心溯溪系列</small><h1>服务中枢</h1><p>统一查看服务注册、实例与近期调用状态。</p></div><button id="refresh" type="button">刷新</button></header>
  <main>
    <p id="startup-error" class="notice error" role="alert" hidden></p>
    <section class="metrics" aria-label="服务中枢指标">
      <article><span>服务</span><strong id="services">-</strong></article>
      <article><span>实例</span><strong id="instances">-</strong></article>
      <article><span>注册表版本</span><strong id="revision">-</strong></article>
    </section>
    <section><div class="section-heading"><div><h2>已注册服务</h2><p>显示当前注册表中可调用的版本化能力。</p></div></div><p id="error" role="alert"></p><div id="service-list" class="list" aria-live="polite"></div></section>
    <section><div class="section-heading"><div><h2>近期调用</h2><p>仅展示脱敏的调用结果、耗时与来源模块。</p></div></div><div id="call-list" class="list" aria-live="polite"></div></section>
  </main>
  <script src="/api/plugin/page/bridge-sdk.js"></script>
  <script type="module" src="./app.js?v=0.2.0-1"></script>
</body>
</html>
